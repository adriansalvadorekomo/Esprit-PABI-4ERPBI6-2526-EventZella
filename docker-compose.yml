services:
  postgres:
    image: postgres:16
    container_name: eventzilla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  fastapi:
    image: eventzilla-fastapi:latest
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: eventzilla-fastapi
    restart: unless-stopped
    environment:
      EVENTZILLA_DB_HOST: postgres
      EVENTZILLA_DB_PORT: 5432
      EVENTZILLA_DB_NAME: ${POSTGRES_DB}
      EVENTZILLA_DB_USER: ${POSTGRES_USER}
      EVENTZILLA_DB_PASSWORD: ${POSTGRES_PASSWORD}
      EVENTZILLA_CORS_ORIGINS: "*"
      GROQ_API_KEY: ${GROQ_API_KEY}
    volumes:
      - ./backend/mlruns:/app/mlruns
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
      - "5001:5001"
    command: >
      bash -c "mlflow ui --host 0.0.0.0 --port 5001 --backend-store-uri file:./mlruns &
               uvicorn api.main:app --host 0.0.0.0 --port 8000"

  flask:
    image: eventzilla-fastapi:latest
    build:
      context: .
      dockerfile: backend.Dockerfile
    container_name: eventzilla-flask
    restart: unless-stopped
    environment:
      EVENTZILLA_DB_HOST: postgres
      EVENTZILLA_DB_PORT: 5432
      EVENTZILLA_DB_NAME: ${POSTGRES_DB}
      EVENTZILLA_DB_USER: ${POSTGRES_USER}
      EVENTZILLA_DB_PASSWORD: ${POSTGRES_PASSWORD}
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    command: python app.py

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    container_name: eventzilla-frontend
    restart: unless-stopped
    depends_on:
      - fastapi
      - flask
    ports:
      - "4200:80"

  n8n:
    image: n8nio/n8n:latest
    container_name: eventzilla-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-admin}
      WEBHOOK_URL: http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: eventzilla-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - fastapi

  grafana:
    image: grafana/grafana:latest
    container_name: eventzilla-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  grafana_data:
  n8n_data:
